<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Arquitetura AWS serverless da plataforma Jarvas</title>
  <desc id="desc">Fluxo do usuário pela aplicação, Cognito, API Gateway e Lambda, com metadados no DynamoDB, documentos no S3, segurança por IAM e KMS, observabilidade no CloudWatch e infraestrutura por CloudFormation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#13243b"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000" flood-opacity=".28"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#5fd4ff"/></marker>
    <marker id="arrow2" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#ffb547"/></marker>
    <style>
      .title{font:700 34px Arial,sans-serif;fill:#fff}.subtitle{font:400 16px Arial,sans-serif;fill:#b8c7da}.zone{fill:#0d1b2c;stroke:#526a86;stroke-width:2;stroke-dasharray:9 7}.zone-title{font:700 15px Arial,sans-serif;fill:#ffb547;letter-spacing:1.3px}.card{fill:#172a42;stroke:#6f8aa8;stroke-width:1.5}.service{font:700 17px Arial,sans-serif;fill:#fff}.detail{font:400 13px Arial,sans-serif;fill:#c9d6e5}.icon{fill:#ff9900}.flow{fill:none;stroke:#5fd4ff;stroke-width:3;marker-end:url(#arrow)}.secure{fill:none;stroke:#ffb547;stroke-width:2.5;stroke-dasharray:7 6;marker-end:url(#arrow2)}.label{font:600 12px Arial,sans-serif;fill:#8ce5ff}.label2{font:600 12px Arial,sans-serif;fill:#ffd18a}.pill{fill:#19374d;stroke:#3a6882}.pilltext{font:600 12px Arial,sans-serif;fill:#bfefff}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="70" y="66" class="title">Jarvas • Arquitetura AWS Serverless</text>
  <text x="70" y="96" class="subtitle">Armazenamento seguro e escalável de documentos para uma plataforma SaaS</text>
  <rect x="50" y="125" width="1500" height="650" rx="24" class="zone"/>
  <text x="76" y="156" class="zone-title">AWS CLOUD · AMBIENTE ISOLADO</text>

  <g filter="url(#shadow)"><rect x="80" y="315" width="205" height="130" rx="16" class="card"/><circle cx="125" cy="360" r="22" class="icon"/><path d="M115 360a10 10 0 1020 0 10 10 0 10-20 0m-8 13c-18 0-27 9-27 18h54c0-9-9-18-27-18" fill="#172a42"/><text x="160" y="351" class="service">Cliente SaaS</text><text x="160" y="376" class="detail">Web / mobile</text><text x="105" y="421" class="detail">Nenhuma credencial AWS</text></g>
  <g filter="url(#shadow)"><rect x="350" y="190" width="230" height="125" rx="16" class="card"/><rect x="375" y="218" width="42" height="42" rx="8" class="icon"/><path d="M388 239l8 8 14-18" fill="none" stroke="#172a42" stroke-width="5"/><text x="435" y="230" class="service">Amazon Cognito</text><text x="435" y="255" class="detail">Identidade e JWT</text><text x="375" y="290" class="detail">Autenticação gerenciada</text></g>
  <g filter="url(#shadow)"><rect x="350" y="380" width="230" height="125" rx="16" class="card"/><path d="M376 413h40v40h-40z" class="icon"/><path d="M384 422h24m-24 10h24m-24 10h16" stroke="#172a42" stroke-width="4"/><text x="435" y="420" class="service">API Gateway</text><text x="435" y="445" class="detail">API HTTPS protegida</text><text x="375" y="480" class="detail">Autorizador Cognito</text></g>
  <g filter="url(#shadow)"><rect x="670" y="350" width="240" height="145" rx="16" class="card"/><circle cx="715" cy="397" r="24" class="icon"/><text x="705" y="405" font-family="Arial" font-size="24" font-weight="700" fill="#172a42">λ</text><text x="755" y="388" class="service">AWS Lambda</text><text x="755" y="413" class="detail">Regras e autorização</text><text x="695" y="458" class="detail">URLs pré-assinadas · validação</text><text x="695" y="478" class="detail">Isolamento pelo Cognito sub</text></g>
  <g filter="url(#shadow)"><rect x="1010" y="220" width="245" height="135" rx="16" class="card"/><ellipse cx="1055" cy="260" rx="24" ry="10" class="icon"/><path d="M1031 260v34c0 6 11 10 24 10s24-4 24-10v-34" fill="#ff9900"/><text x="1100" y="252" class="service">Amazon S3</text><text x="1100" y="277" class="detail">Documentos</text><text x="1035" y="330" class="detail">Versionamento · Block Public Access</text></g>
  <g filter="url(#shadow)"><rect x="1010" y="455" width="245" height="135" rx="16" class="card"/><ellipse cx="1055" cy="495" rx="24" ry="10" class="icon"/><path d="M1031 495v34c0 6 11 10 24 10s24-4 24-10v-34" fill="#ff9900"/><text x="1100" y="487" class="service">DynamoDB</text><text x="1100" y="512" class="detail">Metadados</text><text x="1035" y="565" class="detail">PK por usuário · on-demand</text></g>
  <g filter="url(#shadow)"><rect x="1320" y="190" width="190" height="110" rx="16" class="card"/><path d="M1345 220h38v35h-38z" class="icon"/><circle cx="1364" cy="237" r="8" fill="#172a42"/><text x="1395" y="226" class="service">AWS KMS</text><text x="1395" y="251" class="detail">Criptografia</text><text x="1345" y="280" class="detail">Chaves gerenciadas</text></g>
  <g filter="url(#shadow)"><rect x="1320" y="350" width="190" height="110" rx="16" class="card"/><path d="M1345 378l19-11 19 11v22c0 15-19 25-19 25s-19-10-19-25z" class="icon"/><text x="1395" y="386" class="service">AWS IAM</text><text x="1395" y="411" class="detail">Menor privilégio</text><text x="1345" y="443" class="detail">Roles por função</text></g>
  <g filter="url(#shadow)"><rect x="1320" y="510" width="190" height="110" rx="16" class="card"/><circle cx="1364" cy="548" r="21" fill="none" stroke="#ff9900" stroke-width="7"/><path d="M1364 535v15l12 7" fill="none" stroke="#ff9900" stroke-width="5"/><text x="1395" y="544" class="service">CloudWatch</text><text x="1395" y="569" class="detail">Logs e alarmes</text><text x="1345" y="602" class="detail">Métricas operacionais</text></g>

  <path d="M285 350C315 300 315 260 350 255" class="flow"/><text x="290" y="275" class="label">1 · login</text>
  <path d="M465 315v55" class="flow"/><text x="478" y="347" class="label">JWT</text>
  <path d="M285 400h55" class="flow"/><text x="292" y="390" class="label">2 · API</text>
  <path d="M580 442h80" class="flow"/><text x="595" y="430" class="label">3 · invoca</text>
  <path d="M910 392c45-20 55-85 90-100" class="flow"/><text x="914" y="330" class="label">4 · URL assinada</text>
  <path d="M910 455c45 15 55 55 90 62" class="flow"/><text x="914" y="495" class="label">metadados</text>
  <path d="M285 445c130 235 550 240 715-115" class="flow"/><text x="545" y="681" class="label">5 · upload / download direto por URL pré-assinada (HTTPS)</text>
  <path d="M1320 250h-55" class="secure"/><path d="M1320 400c-120 0-230-5-400 15" class="secure"/><path d="M1320 555h-55" class="secure"/>
  <text x="1268" y="240" class="label2">SSE-KMS</text><text x="1190" y="389" class="label2">políticas</text><text x="1268" y="545" class="label2">telemetria</text>

  <g><rect x="75" y="805" width="255" height="38" rx="19" class="pill"/><text x="96" y="829" class="pilltext">🔒 HTTPS + criptografia em repouso</text><rect x="350" y="805" width="215" height="38" rx="19" class="pill"/><text x="373" y="829" class="pilltext">👤 Isolamento por usuário</text><rect x="585" y="805" width="235" height="38" rx="19" class="pill"/><text x="608" y="829" class="pilltext">↻ Versionamento e histórico</text><rect x="840" y="805" width="250" height="38" rx="19" class="pill"/><text x="863" y="829" class="pilltext">⚡ Escala automática serverless</text><rect x="1110" y="805" width="285" height="38" rx="19" class="pill"/><text x="1133" y="829" class="pilltext">◈ CloudFormation · IaC reproduzível</text></g>
  <text x="1450" y="830" class="subtitle">v1.0</text>
</svg>
